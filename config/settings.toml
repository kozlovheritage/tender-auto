# ================================================================

[thresholds]

# Стоп-фактор #2: минимальный срок поставки (календарных дней).
# Тендеры с меньшим сроком отклоняются.
# 30 — текущее поведение кода. Хотите мягче — увеличьте, жёстче — уменьшите.
min_delivery_days = 30

# ----------------------------------------------------------------
# Зарезервировано под следующие итерации:
# [thresholds] max_positions    — лимит позиций в спецификации
# [brands]     trusted          — доверенные бренды
# [brands]     stop_russian     — российские бренды (стоп)
# ----------------------------------------------------------------

[extraction]
# Текст-бюджет для ЛЛМ. Больше — больше контекста, но и расход токенов.
# Суммарный лимит по всем файлам (символов).
max_text_total = 200000
# Лимит на один файл (символов).
max_text_per_file = 40000
