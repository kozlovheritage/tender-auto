# ================================================================
#  Tender Auto — клиентская конфигурация
#  Правьте значения здесь — код в .py трогать не нужно.
# ================================================================

[thresholds]
# Стоп-фактор #2: минимальный срок поставки (календарных дней).
# Тендеры с меньшим сроком отклоняются.
min_delivery_days = 30

[extraction]
# Текст-бюджет для LLM (символов): больше — больше контекста, но и расход токенов.
max_text_total = 200000
max_text_per_file = 40000

[license]
# true  → GUI при старте требует лицензионный ключ (клиентские сборки)
# false → демо-режим, ключ не спрашивается (твоя рабочая копия)
enabled = true

# Адрес лиценз-сервера (этап 3). Пока пусто — проверка только по
# подписи ключа офлайн (keygen.py), сервер не нужен.
server_url = ""